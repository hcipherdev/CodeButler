name: Public CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify public package
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build package
        run: npm run build

      # Tests that need the native helper's OS key storage skip on Linux;
      # the native job below exercises the helper on macOS and Windows.
      - name: Test
        run: npm test

      - name: Build docs
        run: npm run docs:build

      - name: Check package contents
        run: npm pack --dry-run

  native:
    name: Native helper (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build and package the native helper
        run: npm run package:crypto

      - name: Build package
        run: npm run build

      - name: Smoke-test the packaged helper
        run: npm run test:native-package
