[package]
name = "butler-crypto"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

# Vendored source provenance is recorded under native/vendor.
[dependencies]
hybridcipher-crypto = { path = "../vendor/hybridcipher-crypto" }
base64 = "0.22"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zeroize = "1.7"
sha2 = "0.10"
fs2 = "0.4"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["dpapi", "wincrypt", "winbase"] }
keyring = { version = "3.6", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }

[workspace]
