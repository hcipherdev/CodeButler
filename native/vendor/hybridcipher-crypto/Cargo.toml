[package]
name = "hybridcipher-crypto"
version = "0.1.0"
edition = "2021"
authors = ["HybridCipher Team"]
description = "Core cryptographic primitives for HybridCipher"
license = "MIT OR Apache-2.0"
readme = "PROVENANCE.md"
keywords = ["cryptography", "security", "hybridcipher"]
categories = ["cryptography", "algorithms"]

[features]
default = ["std"]
std = []

[dependencies]
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
ed25519-dalek = "2.0"
chacha20poly1305 = "0.10"
sha2 = "0.10"
hkdf = "0.12"
rand_core = "0.6"
rand = "0.8"
zeroize = { version = "1.7", features = ["derive"] }
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
base64 = "0.22"
uuid = { version = "1.8", default-features = false, features = ["serde"] }
aws-lc-rs = { version = "1.17.0", default-features = false, features = ["aws-lc-sys", "alloc"] }
aws-lc-sys = "0.39.0"

# Secure memory dependencies
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["memoryapi", "errhandlingapi", "winbase", "winnt", "dpapi", "wincrypt"] }

